<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Password Strength Checker</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #071a2d, #0b2d42);
      color: white;
    }

    .container {
      width: 100%;
      max-width: 480px;

      padding: 40px 30px;

      text-align: center;

      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 22px;

      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .icon {
      width: 75px;
      height: 75px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin: 0 auto 20px;

      font-size: 2.5rem;

      background: rgba(0, 195, 255, 0.1);
      border: 1px solid rgba(0, 195, 255, 0.25);
      border-radius: 20px;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 30px;
      font-size: 0.95rem;
    }

    .input-group {
      position: relative;
    }

    input {
      width: 100%;

      padding: 15px 50px 15px 15px;

      color: white;
      background: rgba(255, 255, 255, 0.06);

      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;

      outline: none;
      font-size: 1rem;

      transition: border-color 0.3s ease,
                  box-shadow 0.3s ease;
    }

    input:focus {
      border-color: #00c3ff;

      box-shadow:
        0 0 0 3px rgba(0, 195, 255, 0.08);
    }

    .toggle-password {
      position: absolute;

      top: 50%;
      right: 15px;

      transform: translateY(-50%);

      background: transparent;
      border: none;

      color: #94a3b8;
      font-size: 1.1rem;

      cursor: pointer;
    }

    .strength-bar {
      width: 100%;
      height: 8px;

      margin-top: 20px;

      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;

      overflow: hidden;
    }

    .strength-progress {
      width: 0%;
      height: 100%;

      border-radius: 20px;

      transition:
        width 0.35s ease,
        background 0.35s ease;
    }

    #msg {
      min-height: 25px;

      margin-top: 15px;

      font-size: 1rem;
      font-weight: bold;
    }

    .requirements {
      margin-top: 30px;

      padding: 20px;

      text-align: left;

      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 12px;
    }

    .requirements h3 {
      margin-bottom: 15px;

      color: #cbd5e1;
      font-size: 0.9rem;
    }

    .requirements ul {
      list-style: none;

      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .requirements li {
      color: #94a3b8;
      font-size: 0.85rem;

      transition: color 0.3s ease;
    }

    .requirements li::before {
      content: "○";
      margin-right: 10px;
      color: #64748b;
    }

    .requirements li.valid {
      color: #4ade80;
    }

    .requirements li.valid::before {
      content: "✓";
      color: #4ade80;
    }

    @media (max-width: 480px) {
      .container {
        padding: 30px 20px;
      }

      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="icon">🔐</div>

    <h1>Password Strength Checker</h1>

    <p class="subtitle">
      Enter a password to check how secure it is.
    </p>

    <div class="input-group">
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="new-password"
      />

      <button
        type="button"
        class="toggle-password"
        id="togglePassword"
        aria-label="Show password"
      >
        👁
      </button>
    </div>

    <div class="strength-bar">
      <div
        class="strength-progress"
        id="strengthProgress"
      ></div>
    </div>

    <p id="msg"></p>

    <div class="requirements">

      <h3>Password should contain:</h3>

      <ul>
        <li id="length">At least 8 characters</li>
        <li id="uppercase">One uppercase letter</li>
        <li id="number">One number</li>
        <li id="special">One special character</li>
      </ul>

    </div>

  </div>

  <script>
    const password = document.getElementById("password");
    const message = document.getElementById("msg");
    const strengthProgress =
      document.getElementById("strengthProgress");

    const togglePassword =
      document.getElementById("togglePassword");

    const lengthRequirement =
      document.getElementById("length");

    const uppercaseRequirement =
      document.getElementById("uppercase");

    const numberRequirement =
      document.getElementById("number");

    const specialRequirement =
      document.getElementById("special");


    password.addEventListener("input", checkStrength);


    function checkStrength() {
      const value = password.value;

      const hasLength = value.length >= 8;
      const hasUppercase = /[A-Z]/.test(value);
      const hasNumber = /[0-9]/.test(value);
      const hasSpecial =
        /[!@#$%^&*(),.?":{}|<>]/.test(value);

      lengthRequirement.classList.toggle(
        "valid",
        hasLength
      );

      uppercaseRequirement.classList.toggle(
        "valid",
        hasUppercase
      );

      numberRequirement.classList.toggle(
        "valid",
        hasNumber
      );

      specialRequirement.classList.toggle(
        "valid",
        hasSpecial
      );

      const score =
        Number(hasLength) +
        Number(hasUppercase) +
        Number(hasNumber) +
        Number(hasSpecial);


      if (value.length === 0) {
        message.textContent = "";

        strengthProgress.style.width = "0%";

        return;
      }


      if (score <= 1) {
        message.textContent = "Weak Password";

        message.style.color = "#f87171";

        strengthProgress.style.width = "33%";

        strengthProgress.style.background =
          "#f87171";

      } else if (score <= 3) {
        message.textContent = "Medium Password";

        message.style.color = "#facc15";

        strengthProgress.style.width = "66%";

        strengthProgress.style.background =
          "#facc15";

      } else {
        message.textContent = "Strong Password";

        message.style.color = "#4ade80";

        strengthProgress.style.width = "100%";

        strengthProgress.style.background =
          "#4ade80";
      }
    }


    togglePassword.addEventListener(
      "click",
      () => {
        if (password.type === "password") {
          password.type = "text";

          togglePassword.textContent = "🙈";
        } else {
          password.type = "password";

          togglePassword.textContent = "👁";
        }
      }
    );
  </script>

</body>
</html>
